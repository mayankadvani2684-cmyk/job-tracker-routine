name: Daily LinkedIn Job Scraper

on:
  schedule:
    - cron: '30 3 * * *'   # 9:00 AM IST (UTC+5:30) = 03:30 UTC
  workflow_dispatch:         # lets you trigger manually from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-auth google-auth-httplib2 google-api-python-client

      - name: Run scraper
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python run_jobs.py

      - name: Upload Excel to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          python - <<'EOF'
          import os, json, glob
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.service_account import Credentials

          # Load service account credentials from secret
          creds_json = json.loads(os.environ["GDRIVE_CREDENTIALS"])
          creds = Credentials.from_service_account_info(
              creds_json,
              scopes=["https://www.googleapis.com/auth/drive.file"]
          )
          service = build("drive", "v3", credentials=creds)

          # Find today's Excel file
          files = glob.glob("LinkedIn_Jobs_*.xlsx")
          if not files:
              print("No Excel file found — scraper may have produced no results")
              exit(0)

          filepath = sorted(files)[-1]   # latest file if multiple
          filename = os.path.basename(filepath)
          print(f"Uploading: {filename}  ({os.path.getsize(filepath):,} bytes)")

          # Check if file already exists in Drive root — update it if so
          existing = service.files().list(
              q=f"name='{filename}' and 'root' in parents and trashed=false",
              fields="files(id, name)"
          ).execute().get("files", [])

          media = MediaFileUpload(
              filepath,
              mimetype="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              resumable=True
          )

          if existing:
              file_id = existing[0]["id"]
              service.files().update(fileId=file_id, media_body=media).execute()
              print(f"Updated existing Drive file: {file_id}")
          else:
              meta = {"name": filename, "parents": ["root"]}
              result = service.files().create(
                  body=meta, media_body=media, fields="id"
              ).execute()
              print(f"Created new Drive file: {result['id']}")
          EOF

      - name: Commit Excel to repo (backup)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LinkedIn_Jobs_*.xlsx || true
          git diff --staged --quiet || git commit -m "Daily jobs: $(date +'%Y-%m-%d')"
          git push || true
