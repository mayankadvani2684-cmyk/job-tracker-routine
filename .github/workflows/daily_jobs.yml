name: Daily LinkedIn Job Scraper

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests google-auth google-auth-httplib2 google-api-python-client

      - name: Run scraper
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python run_jobs.py

      - name: Email Excel to yourself
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.GMAIL_USER }}
        run: |
          python - <<'EOF'
          import os, glob, smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.base import MIMEBase
          from email.mime.text import MIMEText
          from email import encoders
          from datetime import date

          files = glob.glob("LinkedIn_Jobs_*.xlsx")
          if not files:
              print("No Excel file found — skipping email")
              exit(0)

          filepath = sorted(files)[-1]
          filename = os.path.basename(filepath)

          msg = MIMEMultipart()
          msg["From"]    = os.environ["GMAIL_USER"]
          msg["To"]      = os.environ["TO_EMAIL"]
          msg["Subject"] = f"LinkedIn Jobs — {date.today().strftime('%d %b %Y')}"

          msg.attach(MIMEText(f"Daily job tracker attached — {filename}", "plain"))

          with open(filepath, "rb") as f:
              part = MIMEBase("application", "octet-stream")
              part.set_payload(f.read())
          encoders.encode_base64(part)
          part.add_header("Content-Disposition", f'attachment; filename="{filename}"')
          msg.attach(part)

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as server:
              server.login(os.environ["GMAIL_USER"], os.environ["GMAIL_APP_PASSWORD"])
              server.send_message(msg)
              print(f"Email sent: {filename}")
          EOF

      - name: Commit Excel to repo (backup)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LinkedIn_Jobs_*.xlsx || true
          git diff --staged --quiet || git commit -m "Daily jobs: $(date +'%Y-%m-%d')"
          git push || true
